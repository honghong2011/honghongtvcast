// ==========================================================================
// 顶层构建文件，配置所有子项目/模块共享的构建参数
// ==========================================================================

buildscript {
    ext.kotlin_version = '1.3.72' // Kotlin 版本，与 AS 3.5.3 + AGP 3.5.3 兼容
    repositories {
        // 阿里云镜像（加速国内访问，避免 SSL 证书问题）
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
    dependencies {
        // Android Gradle 插件，锁定 3.5.3（AS 3.5.3 对应版本）
        classpath 'com.android.tools.build:gradle:3.5.3'
        // Kotlin Gradle 插件
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: 不要在这里放置应用依赖，它们属于各模块的 build.gradle
    }
}

allprojects {
    repositories {
        // 阿里云镜像（加速国内访问，避免 google()/jcenter() 的 SSL 证书问题）
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        // 阿里云 JitPack 镜像
        maven { url 'https://maven.aliyun.com/repository/jitpack-io' }
        // Maven Central 兜底
        mavenCentral()
        // Google 官方仓库兜底
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
